name: Friend Circle Update

on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间8点自动更新一次
  workflow_dispatch:      # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Friend-Circle-Lite
        uses: Luminous-0905/Friend-Circle-Lite@main
        with:
          config_path: config.yml

      - name: Commit & Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add friend.json
          git commit -m "Update friend.json" || echo "No changes to commit"
          git push
