name: Friend Circle Update
on:
  schedule:
    - cron: '0 0 * * *' # UTC 0点 = 北京时间早8点
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 运行友链朋友圈抓取
        uses: xiaoshi0208/Friend-Circle@main
        with:
          config_path: ./config.yml
      
      - name: 提交数据文件
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add friend.json
          git commit -m "Update friend.json" || echo "no changes to commit"
          git push
